# Standalone PostgreSQL stack; use -f compose.postgres.yaml, not as an override.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kitchen
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: local-postgres-only
    volumes:
      - kitchen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8089}:80"
    environment:
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kitchen
      DB_USER: kitchen
      DB_PASSWORD: local-postgres-only
      DB_SSLMODE: disable
      DEMO_PASSWORD: Stimbeck-Demo-2026!
      APP_ENV: local
      MENU_SEED: ${MENU_SEED:-speisekarte}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  kitchen-postgres:
